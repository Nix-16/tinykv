# 基础网络
bind 0.0.0.0
port 6380

# 网络模型：reactor | proactor（目前仅实现 reactor）
network reactor

# 内存分配器：system | jemalloc
allocator jemalloc

# AOF 持久化
appendonly yes
appendfilename appendonly.aof

# fsync 策略：always | everysec | no
appendfsync everysec

# snapshot 全量持久化
snapshot_file dump.kvs
snapshot_enabled yes
